<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WhatsApp</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Link para a página de cadastro */
    .link-registro {
      display: block;
      margin-top: 18px;
      font-size: 0.82rem;
      color: #667781;
      text-decoration: none;
    }
    .link-registro span {
      color: #128c7e;
      font-weight: 600;
    }
    .link-registro:hover span {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <!-- Ícone do WhatsApp -->
    <div class="logo">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="#25D366">
        <path d="M12.004 2c-5.523 0-10 4.477-10 10 0 1.766.457 3.427 1.258 4.873l-1.258 4.602 4.71-1.236c1.4.747 2.996 1.173 4.69 1.173 5.523 0 10-4.477 10-10s-4.477-10-10-10zm5.82 14.156c-.244.686-1.42 1.31-1.956 1.378-.49.062-1.127.288-3.69-.728-3.153-1.246-5.18-4.432-5.337-4.636-.157-.204-1.278-1.701-1.278-3.245 0-1.544.808-2.303 1.096-2.613.288-.31.628-.387.838-.387.21 0 .42.003.602.012.192.01.45-.073.704.536.262.628.89 2.17.968 2.327.078.157.131.34.026.548-.105.21-.157.34-.314.523-.157.183-.33.407-.472.548-.157.157-.32.328-.138.642.183.314.812 1.34 1.74 2.167 1.194 1.065 2.2 1.396 2.514 1.553.314.157.498.131.681-.078.183-.21.785-.916.995-1.23.21-.314.42-.262.707-.157.288.105 1.83.863 2.144 1.02.314.157.523.235.602.366.078.131.078.76-.166 1.446z"/>
      </svg>
    </div>

    <h1>Entrar</h1>
    <p class="subtitle">Insira o seu número de WhatsApp e palavra-passe para continuar</p>

    <!-- Formulário de Login -->
    <form id="form-login" onsubmit="event.preventDefault(); realizarLogin();">

      <!-- Campo Telefone -->
      <div class="form-group">
        <label for="login-telefone">Número de telefone</label>
        <div class="input-container">
          <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8696a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <input type="tel" id="login-telefone" placeholder="" required>
        </div>
      </div>

      <!-- Campo Palavra-passe -->
      <div class="form-group">
        <label for="login-senha">Palavra-passe</label>
        <div class="input-container">
          <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8696a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="login-senha" placeholder="" required>
        </div>
      </div>

      <button type="submit" class="btn-continue">Continuar</button>

    </form>

    <!-- Link para criar conta -->
    <a href="registro.html" class="link-registro">Não tem conta? <span>Criar conta</span></a>

    <div class="footer-text">
      Protegido por <span>WhatsApp Login</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
