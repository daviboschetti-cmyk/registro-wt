<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - WhatsApp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-card {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      height: 85vh;
      max-height: 720px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Topo */
    .chat-header {
      background: #128c7e;
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header .titulo { font-size: 0.8rem; opacity: 0.85; }
    .chat-header .conta  { font-size: 1rem; font-weight: 700; }

    .btn-sair {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-sair:hover { background: rgba(255, 255, 255, 0.28); }

    /* Mensagens */
    #messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 78%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #111b21;
      line-height: 1.35;
      word-wrap: break-word;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.08);
    }
    .msg.enviada  { align-self: flex-end;   background: #d9fdd3; border-top-right-radius: 2px; }
    .msg.recebida { align-self: flex-start; background: #ffffff; border-top-left-radius: 2px; }

    .msg-meta { font-size: 0.7rem; font-weight: 600; color: #128c7e; margin-bottom: 2px; }
    .msg-hora { font-size: 0.65rem; color: #667781; text-align: right; margin-top: 2px; }

    /* Envio */
    .chat-footer {
      padding: 12px;
      border-top: 1px solid #f0f2f5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-footer input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e9edef;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #111b21;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .chat-footer input:focus {
      border-color: #128c7e;
      box-shadow: 0 0 0 2px rgba(18, 140, 126, 0.15);
    }

    .linha-msg { display: flex; gap: 8px; }

    .btn-enviar {
      background-color: #128c7e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-enviar:hover  { background-color: #075e54; }
    .btn-enviar:active { transform: scale(0.97); }
  </style>
</head>
<body onload="verificarAutenticacao(); iniciarChat();">

  <main class="chat-card">

    <header class="chat-header">
      <div>
        <div class="titulo">Conectado como</div>
        <div class="conta" id="conta-logada"></div>
      </div>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </header>

    <div id="messages-box"></div>

    <div class="chat-footer">
      <input type="tel" id="chat-destinatario" placeholder="Telefone do destinatário">
      <div class="linha-msg">
        <input type="text" id="chat-mensagem" placeholder="Digite uma mensagem" autocomplete="off">
        <button class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
